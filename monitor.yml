name: Alert Monitor System

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Restore state file cache
      uses: actions/cache@v3
      with:
        path: state.json
        key: state-${{ github.run_id }}
        restore-keys: |
          state-
          
    - name: Run monitoring script
      env:
        CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        FB_PAGE_2: ${{ secrets.FB_PAGE_2 }}
        FB_PAGE_3: ${{ secrets.FB_PAGE_3 }}
        STOP_ALERTS: ${{ vars.STOP_ALERTS }}
      run: python main.py
      
    - name: Save state file cache
      uses: actions/cache/save@v3
      if: always()
      with:
        path: state.json
        key: state-${{ github.run_id }}
