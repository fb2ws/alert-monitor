name: Alert Monitor System

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_monitor]
  push:
    branches: [ "main", "master" ]

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      - name: Run monitor
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          FB_PAGE_1: ${{ secrets.FB_PAGE_1 }}
          FB_PAGE_2: ${{ secrets.FB_PAGE_2 }}
          FB_PAGE_3: ${{ secrets.FB_PAGE_3 }}
        run: python main.py

      - name: Save state
        uses: actions/upload-artifact@v4
        with:
          name: state-file
          path: state.json
          retention-days: 1
