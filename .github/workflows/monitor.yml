name: Alert Monitor System

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_monitor]
  push:
    branches: [ "main", "master" ]

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        
    - name: Install Playwright Browsers & Dependencies
      run: |
        sudo apt-get update
        playwright install --with-deps chromium
        
    - name: Restore state file memory (Cache)
      uses: actions/cache/restore@v4
      with:
        path: state.json
        key: state-memory-${{ github.run_id }}
        restore-keys: |
          state-memory-
          
    - name: Run monitoring script
      env:
        CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        FB_PAGE_1: ${{ secrets.FB_PAGE_1 }}
        FB_PAGE_2: ${{ secrets.FB_PAGE_2 }}
        FB_PAGE_3: ${{ secrets.FB_PAGE_3 }}
        STOP_ALERTS: ${{ vars.STOP_ALERTS }}
      run: python main.py
      
    - name: Save state file memory (Cache)
      uses: actions/cache/save@v4
      if: always()
      with:
        path: state.json
        key: state-memory-${{ github.run_id }}

    - name: Upload Visible Report (Artifact)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-report
        path: state.json
        retention-days: 7

    - name: Print Report to Console
      if: always()
      run: |
        if [ -f state.json ]; then
          echo "--- LATEST LOGS ---"
          cat state.json
        fi
