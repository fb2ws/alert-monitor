name: Alert Monitor System

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_monitor]

permissions:
  contents: read

# Prevent overlapping runs from reading and saving state.json simultaneously.
concurrency:
  group: alert-monitor-single-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      # Chromium is already installed in this path inside the pinned image.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    # Version-matched Playwright image: Chromium and all Linux browser
    # dependencies are already included. No apt-get or browser installation.
    container:
      image: mcr.microsoft.com/playwright/python:v1.46.0-jammy
      options: --user 1001

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Python package in the Playwright container
      run: |
        # Use the container's native Ubuntu 22.04-compatible Python.
        # Do NOT add actions/setup-python here.
        python3 --version
        python3 -m pip install --user --disable-pip-version-check -r requirements.txt

    - name: Restore state memory
      uses: actions/cache/restore@v4
      with:
        path: state.json
        key: state-memory-${{ github.run_id }}
        restore-keys: |
          state-memory-

    - name: Run monitoring script
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        FB_PAGE_1: ${{ secrets.FB_PAGE_1 }}
        FB_PAGE_2: ${{ secrets.FB_PAGE_2 }}
        FB_PAGE_3: ${{ secrets.FB_PAGE_3 }}
        STOP_ALERTS: ${{ vars.STOP_ALERTS }}
      run: python3 main.py

    - name: Save state memory
      uses: actions/cache/save@v4
      if: always()
      with:
        path: state.json
        key: state-memory-${{ github.run_id }}

    - name: Upload visible report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: execution-report
        path: state.json
        retention-days: 7

    - name: Print report to console
      if: always()
      run: |
        if [ -f state.json ]; then
          echo "--- LATEST LOGS ---"
          cat state.json
        else
          echo "No state.json was created."
        fi
