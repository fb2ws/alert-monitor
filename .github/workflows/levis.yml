name: ZenRows Levi's Promotion Monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_levis]

permissions:
  contents: read

# Separate from the Facebook/Owndays group so each monitor can run independently,
# while preventing two Levi's jobs from overwriting levis_state.json.
concurrency:
  group: levis-zenrows-single-run
  cancel-in-progress: false

jobs:
  levis-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ZenRows monitor dependency
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-levis.txt

    - name: Restore Levi's state memory
      uses: actions/cache/restore@v4
      with:
        path: levis_state.json
        key: levis-state-${{ github.run_id }}
        restore-keys: |
          levis-state-

    - name: Run ZenRows Levi's monitor
      env:
        ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        ZENROWS_CYCLE_START_DAY: ${{ vars.ZENROWS_CYCLE_START_DAY }}
        STOP_ALERTS: ${{ vars.STOP_ALERTS }}
        STOP_LEVIS_ALERTS: ${{ vars.STOP_LEVIS_ALERTS }}
      run: python levis_zenrows.py

    - name: Save Levi's state memory
      uses: actions/cache/save@v4
      if: always()
      with:
        path: levis_state.json
        key: levis-state-${{ github.run_id }}

    - name: Upload Levi's report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: levis-zenrows-report
        path: levis_state.json
        retention-days: 7

    - name: Print Levi's report to console
      if: always()
      run: |
        if [ -f levis_state.json ]; then
          echo "--- LEVIS ZENROWS REPORT ---"
          cat levis_state.json
        else
          echo "No levis_state.json was created."
        fi
