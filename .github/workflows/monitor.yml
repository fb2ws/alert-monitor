name: Alert Monitor System

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_monitor]

permissions:
  contents: read

# One monitor run at a time prevents state-cache races. Runs wait rather than
# being cancelled halfway through an email or state save.
concurrency:
  group: alert-monitor-single-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # The browser image stores its preinstalled executables here.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    # This pinned image already contains Chromium and its Linux dependencies.
    # It replaces apt-get and `playwright install --with-deps`, which caused
    # the multi-hour queueing problem on the hosted runner.
    container:
      image: mcr.microsoft.com/playwright/python:v1.46.0-jammy
      options: --user 1001

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Python packages in the container
      run: |
        # Do not use actions/setup-python here: its Ubuntu 24.04 Python
        # requires GLIBC 2.38, while the version-matched browser image is
        # Ubuntu 22.04. Use the container's compatible Python instead.
        python3 --version
        python3 -m pip install --user --disable-pip-version-check -r requirements.txt

    - name: Restore state memory
      uses: actions/cache/restore@v4
      with:
        path: state.json
        key: state-memory-${{ github.run_id }}
        restore-keys: |
          state-memory-

    - name: Run monitoring script
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        CLEAN_SENT_ALERTS: ${{ vars.CLEAN_SENT_ALERTS }}
        # Repository variable FB_PAGES: one URL per line (or comma-separated).
        # Example:
        # https://www.facebook.com/phone2phone.hk
        # https://www.facebook.com/kimbihome
        # https://www.facebook.com/hahaphone.hk
        FB_PAGES: ${{ vars.FB_PAGES }}
        # Legacy fallback supported by main.py during migration:
        FB_PAGE_1: ${{ secrets.FB_PAGE_1 }}
        FB_PAGE_2: ${{ secrets.FB_PAGE_2 }}
        FB_PAGE_3: ${{ secrets.FB_PAGE_3 }}
        STOP_ALERTS: ${{ vars.STOP_ALERTS }}
      run: python3 main.py

    - name: Save state memory
      uses: actions/cache/save@v4
      if: always()
      with:
        path: state.json
        key: state-memory-${{ github.run_id }}

    - name: Upload visible report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: execution-report
        path: state.json
        retention-days: 7

    - name: Print report to console
      if: always()
      run: |
        if [ -f state.json ]; then
          echo "--- LATEST LOGS ---"
          cat state.json
        else
          echo "No state.json was created."
        fi
