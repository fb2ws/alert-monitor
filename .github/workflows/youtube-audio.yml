name: YouTube audio alerts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_monitor]

permissions:
  contents: read

# Prevent overlapping YouTube runs from downloading or emailing the same video.
concurrency:
  group: youtube-audio-single-run
  cancel-in-progress: false

jobs:
  download-and-email:
    runs-on: ubuntu-latest
    # A 15-minute trigger may arrive while a backlog is still processing.
    # Never cancel the active run; let it checkpoint and finish.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno JavaScript runtime for YouTube challenge solving
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.0
          cache: true

      - name: Install yt-dlp
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir --upgrade "yt-dlp[default]"
          python3 -c "import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)"
          yt-dlp --version

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          elif [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
          else
            echo "::error::YOUTUBE_COOKIES is missing. Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
          if ! grep -qE '^# (Netscape )?HTTP Cookie File' "$RUNNER_TEMP/youtube-cookies.txt"; then
            echo "::error::The cookie secret is not Netscape/Mozilla cookie-file format. Re-export it with yt-dlp --cookies-from-browser ... --cookies youtube-cookies.txt."
            rm -f "$RUNNER_TEMP/youtube-cookies.txt"
            exit 1
          fi
          echo "YouTube cookie file prepared and format validated."

      - name: Restore YouTube state
        uses: actions/cache/restore@v4
        with:
          path: youtube_state.json
          key: youtube-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            youtube-state-${{ github.ref_name }}-
            youtube-state-

      - name: Check channels and send audio attachments
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          # Repository variable. Example: HKLocalTV,AnotherChannel
          YOUTUBE_DISABLED_CHANNELS: ${{ vars.YOUTUBE_DISABLED_CHANNELS }}
          # Temporary recovery switch; normally leave empty. Accepts Qiage or @qiage.
          YOUTUBE_RESET_CHANNELS: ${{ vars.YOUTUBE_RESET_CHANNELS }}
          # Do not email existing videos during initial setup.
          YOUTUBE_BOOTSTRAP_ALERT: "false"
          # Process at most three backlog videos in one run.
          YOUTUBE_MAX_NEW_PER_RUN: "3"
          # Conservative throttling; these do not replace authentication cookies.
          YOUTUBE_CHANNEL_PAUSE_MIN: "10"
          YOUTUBE_CHANNEL_PAUSE_MAX: "30"
          YOUTUBE_METADATA_PAUSE_MIN: "3"
          YOUTUBE_METADATA_PAUSE_MAX: "10"
        run: |
          if [ -f "$RUNNER_TEMP/youtube-cookies.txt" ]; then
            export YOUTUBE_COOKIES_FILE="$RUNNER_TEMP/youtube-cookies.txt"
            echo "YouTube cookie authentication: enabled"
          else
            echo "::error::Temporary cookie file is missing after preparation."
            exit 1
          fi
          python3 youtube_audio.py

      - name: Remove temporary YouTube cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/youtube-cookies.txt"

      - name: Save YouTube state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: youtube_state.json
          key: youtube-state-${{ github.ref_name }}-${{ github.run_id }}
