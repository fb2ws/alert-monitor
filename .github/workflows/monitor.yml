name: Alert Monitor System

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_monitor]

permissions:
  contents: read

# Keep the original monitor from overlapping with itself while an email or
# state-cache operation is in progress.
concurrency:
  group: alert-monitor-single-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    container:
      image: mcr.microsoft.com/playwright/python:v1.46.0-jammy
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python3 --version
          # Use the official PyPI index and retry transient/corrupted downloads.
          # Keep requirements hashes enabled; do not bypass integrity checks.
          python3 -m pip install --user --disable-pip-version-check --no-cache-dir --retries 5 --index-url https://pypi.org/simple -r requirements.txt

      - name: Restore state memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-memory-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            state-memory-${{ github.ref_name }}-
            state-memory-

      - name: Run Facebook, ePrice, and OWNDAYS monitors
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          CLEAN_SENT_ALERTS: ${{ vars.CLEAN_SENT_ALERTS }}
          FB_PAGES: ${{ vars.FB_PAGES }}
          FB_PAGE_1: ${{ secrets.FB_PAGE_1 }}
          FB_PAGE_2: ${{ secrets.FB_PAGE_2 }}
          FB_PAGE_3: ${{ secrets.FB_PAGE_3 }}
          FB_SKIP_TERMS_AILLYNOTES: ${{ vars.FB_SKIP_TERMS_AILLYNOTES }}
          STOP_ALERTS: ${{ vars.STOP_ALERTS }}
          # Prevent Facebook post text and diagnostics from appearing in logs.
          PRINT_STATE_REPORT: "false"
        run: python3 main.py

      - name: Save state memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-memory-${{ github.ref_name }}-${{ github.run_id }}
