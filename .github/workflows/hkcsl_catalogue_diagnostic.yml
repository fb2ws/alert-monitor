name: HKCSL Xiaomi One-Time Catalogue Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-public-catalogue-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight diagnostic dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-hkcsl-diagnostic.txt

      - name: Fetch and summarise public catalogue once
        run: python hkcsl_catalogue_diagnostic.py

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hkcsl-catalogue-diagnostic
          path: |
            hkcsl_catalogue_summary.json
            hkcsl_raw_response.html
          if-no-files-found: warn
          retention-days: 7
